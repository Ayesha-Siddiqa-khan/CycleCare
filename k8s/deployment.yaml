apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyclecare
  labels:
    app: cyclecare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cyclecare
  template:
    metadata:
      labels:
        app: cyclecare
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 300
      containers:
        - name: cyclecare
          image: 257536659737.dkr.ecr.us-east-1.amazonaws.com/cyclecare:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cyclecare-service
  labels:
    app: cyclecare
spec:
  type: NodePort
  selector:
    app: cyclecare
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
